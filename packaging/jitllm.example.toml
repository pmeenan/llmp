#
# An annotated jitLLM node configuration (D-063, D-073). The package ships
# no configuration: with none, the runtime is a standalone node with the
# defaults shown commented out below. To change one, put the key in
# /etc/jitllm/jitllm.toml or in a fragment /etc/jitllm/jitllm.d/NAME.toml,
# owned by root and writable by nobody else, then restart the service. Each
# key may be set in one file only, and every file starts with
# schema_version. Unknown keys are errors; `jitllm doctor` reports every
# problem with its file, line and column.

schema_version = 2

[storage]
# The base for relative role paths.
# data_dir = "/var/lib/jitllm"

# Installed artifacts: a local ext4, XFS or Btrfs filesystem with direct I/O.
# installed = "models"
# Conversation state set aside under memory pressure; 0700, local.
# spill = "spill"
# The runtime's durable records; 0700, local.
# state = "state"
# Downloaded checkpoints awaiting import; anyone may add files (1777).
# checkpoints = "checkpoints"

# An optional long-term store (a NAS or USB disk) that only import, install
# and archive jobs open; it must not hold installed, spill or state.
# long_term = "/mnt/nas/jitllm"
# Archived artifacts, inside long_term (a relative path is relative to it).
# archive = "archive"

# A role outside /var/lib/jitllm also needs the service's sandbox opened
# for it: `systemctl edit jitllm`, then under [Service] add
# ReadWritePaths=/that/path.

[limits]
# The v2 bounds (docs/cluster-design.md); the only profile.
# profile = "initial-v2"

# The models the node serves (D-096), a table each, by the name a request
# uses: an installed artifact (or, for a pipeline, a composition) by its ID,
# the directory's name under `installed`. The service serves them on the
# chat route ([client] below; D-097), and `jitllm-runtime chat`
# and `jitllm-runtime swap-table` by hand.
# [models.deepseek]
# artifact = "<64 hex digits>"
# A speculative drafter's artifact; speculation is then the default decode.
# drafter = "<64 hex digits>"
# speculation = true
# With a drafter, the form of waves of two or more concurrent requests
# (DeepSeek): "auto" chooses per wave from the drafts accepted; the
# exactness controls "speculative" (every wave draft-verify, so a reply at
# several requests equals the reply alone) and "plain" (every wave plain
# decode) fix it.
# wave_form = "auto"
# Tokens of conversation state, default 262144, at least 512. There is no
# generic ceiling; registration enforces the checkpoint's trained ceiling
# (DeepSeek V4 Flash 1048576, Qwen3.8 Flash Next 262144). State grows with
# use inside the physical memory budget; the ceiling alone backs no cache.
# A node may name any number of models: the library may exceed memory.
# context = 262144
# Rows of a prefill chunk, 1 to 262144; by default the runtime's choice for
# the model (Qwen3.8 4096; DeepSeek V4 4096 to a context of 262144, 2048
# above it), capped at what the model
# allows at its context (below it) and, from 8 rows, rounded down to a
# multiple of 8; the runtime logs the chunk it uses. A chunk is how soon a
# prefill notices a cancellation.
# prefill_chunk = 4096
# Throughput floors, in tokens a second, from which the chat route figures
# how long a prefill chunk may take before the backend is reported as
# stalled, and a configured non-streaming deadline (docs/runtime-serving.md,
# "Progress and deadlines"): below the model's speeds at short context,
# with a margin of three for depth. Prefill 1 to 1000000, decode 1 to
# 100000.
# prefill_floor_tok_s = 100
# decode_floor_tok_s = 5
# Request slots: how many of the model's chat requests run at once (each
# its own conversation state, and an idle conversation kept for reuse), 1
# to 16; by default the model's measured knee (DeepSeek V4 and Qwen3.8: 4),
# DeepSeek with DSpark at most 8. Below it, memory decides: a request joins
# only when its prompt's state fits beside the others' (docs/runtime-
# serving.md, "Request slots").
# max_slots = 4
# For an artifact whose metadata keeps no tokenizer or chat template: the
# checkpoint's, owned by root or the runtime's user and writable by nobody
# else.
# tokenizer = "/path/to/tokenizer.json"
# chat_template = "/path/to/chat_template.jinja"
#
# [models.image]
# composition = "<64 hex digits>"

[client]
# Where the service listens for /v1/chat/completions and /v1/models when
# models are configured (D-097): one entry or a list. "loopback" is
# 127.0.0.1 and [::1]; "tailscale" is this node's tailnet addresses, found
# at startup (none: loopback only, logged). An address may be given too,
# with or without a port ("192.168.1.5", "0.0.0.0:8114", "[::]"). No
# binding needs authentication, as with other engines (an optional API key
# comes with M5); the start log names each listener beyond loopback and the
# tailnet as served without it.
# bind = ["loopback", "tailscale"]
# The port of "loopback", "tailscale" and an address written without one.
# port = 8114
#
# Limits (D-102): every default is permissive, each limit follows a real
# resource (memory, descriptors, the model's context), and no time limit
# stops work that is making progress. Set one to be stricter, for example
# when binding beyond loopback and the tailnet. Seconds are 1 to 2592000.
#
# Open connections, idle keep-alive ones included; absent, what the
# open-file hard limit allows less 256 for the runtime's own files.
# max_connections = 1024
# Requests waiting behind the active ones; absent, no count (a 429 past it).
# max_queued = 64
# How long a non-streaming request may wait in the queue; absent, its turn
# (a 429 past it). A stream, held by keepalives, always waits its turn.
# queue_wait_seconds = 120
# No progress (no swap, prefill chunk or decode step ending) for this long,
# each long unit allowed its expected time on top, is a stall: "report"
# logs it, marks the backend unhealthy and says so in the service status,
# while every request goes on; "fail" also ends the stalled requests (504)
# and refuses others (503) until the backend moves.
# stall_seconds = 120
# stall_action = "report"
# A non-streaming request's deadline: its work at the floors above, three
# times over, at most this; absent, none (a stream never has one).
# deadline_cap_seconds = 14400
# A kept-alive connection idle between requests is closed after this.
# idle_seconds = 60
# A request's head or body that sends no byte for this long gets a 408; a
# slow one that keeps sending is never cut off.
# request_inactivity_seconds = 60
# A client that takes no output for this long is dropped; absent, a stream
# whose client stops reading pauses until it reads (backpressure).
# write_inactivity_seconds = 30
# Work under way with nothing moving at all (no unit ending, no page-in)
# for this long is a confirmed hang: the runtime exits for systemd to
# restart it. Absent, the larger of 600 and five stall times; at least 60.
# hang_seconds = 600
# The request memory: one pool every request's host memory is charged to
# (bodies as they arrive, parses, queued requests, renderings, stop
# strings, unread output, responses). 256 MiB is set apart at the start;
# past it the pool grows within the memory budget (displacing caches and
# idle conversations) and shrinks as requests end. This caps it; past what
# it can hold a request is refused (413, or 503 to retry). Absent, no cap
# but the budget's state room.
# request_memory_bytes = 2147483648
# A request body's most (absent: 1/16 of the request memory and the largest
# configured context's bytes, at most 4294967295), and a stream's unread
# output before its request pauses (absent: 4 MiB, a 64th of the 256 MiB
# set apart). The start log names the values in force.
# max_body_bytes = 134217728
# stream_buffer_bytes = 4194304

[memory]
# Conversation state under memory pressure (D-055 as amended 2026-10-02).
# An idle conversation's state stays resident while the memory budget has
# room; when it is needed, the runtime writes it to the spill directory
# ([storage] spill) and restores it exactly at the conversation's next
# turn, rather than prefilling it again. An idle conversation, resident or
# spilled, and its turn checkpoints stay reusable for retention_hours
# (1 to 8760) after their last use.
# retention_hours = 24
# The most spilled conversation state the spill directory keeps (0 to
# 1048576 GiB), a swapped-out model's conversations included: past it the
# least recently used is deleted first. 0 keeps none: idle state is then
# dropped, and its next turn prefills again.
# spill_budget_gib = 128

# A cluster member's keys (cluster_file, node_id, [credentials], [control])
# are written by cluster enrollment, which arrives in M6a; this build
# refuses to run as a member.
