# Project tools and tasks (D-012, D-049, D-057, D-061, D-070). mise pins only the
# Python that runs tools/; the compilers, CUDA, CMake and Ninja come from the
# pinned SDK that `mise run setup` provisions from toolchains/, and the
# third-party sources from third_party/sources.lock.json. Nothing here changes
# global compilers or shell startup files. The first time, run `mise trust`.
# Arguments after the task name go to the tool, for example
# `mise run test -- cross`, `mise run test -- cross --host <spark>` or
# `mise run check:spark -- --host <spark>`.

min_version = "2026.9.12"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64"]

[tools]
python = "3.14.7"

[tasks.setup]
description = "Provision the pinned SDK for this host, then prepare the locked sources (idempotent; --dry-run previews)"
run = "python3 tools/setup"

[tasks.prepare]
description = "Fetch, verify and unpack the locked sources into build/sources (--modules adds optional ones; --check validates the lock)"
run = "python3 tools/prepare-sources"

[tasks.doctor]
description = "Check the SDK and host prerequisites and report toolchain, driver and SDK identities"
run = "python3 tools/check-toolchain"

[tasks.build]
description = "Configure and build CMake presets with the SDK (default: this host's native preset)"
run = "python3 tools/build build"

[tasks.test]
description = "Build presets and run their tests; --host runs a cross build's tests on a Spark over SSH, --gpu the native build's discrete-GPU tests here"
run = "python3 tools/build test"

[tasks.deploy]
description = "Build the cross preset and copy it to a Spark over SSH (--host is required)"
run = "python3 tools/build deploy"

[tasks.package]
description = "Build the cross preset from locked sources and its arm64 Debian package (build/cross/package/)"
run = "python3 tools/build package"

[tasks.check]
description = "The workstation check tier, at milestone gates and for host-needing changes (D-084): formatting, clang-tidy, tooling tests, native, CPU-only and cross builds and tests"
run = "python3 tools/check"

[tasks."check:full"]
description = "check, the sanitizer builds and the offline, copyleft-disabled build in the reference container"
run = "python3 tools/check full"

[tasks."check:spark"]
description = "The cross, ASan and TSan builds' tests on a Spark over SSH, GPU tests included (--host is required)"
run = "python3 tools/check spark"
